    function esc(value) {
        return String(value == null ? '' : value)

    function parseHash() {
        var raw = (location.hash || '#dashboard').replace(/^#/, '');

        var page = parts[0] || 'dashboard';
        var params = {};
        if (parts[1]) {
            parts[1].split('&').forEach(function (pair) {
                var kv = pair.split('=');
                params[decodeURIComponent(kv[0] || '')] = decodeURIComponent(kv[1] || '');
            });
        }
        if (page === 'logout') {
            sessionStorage.removeItem('cms_preview_auth');
            state.loggedIn = false;
            location.hash = '#login';
            return;
        }
        state.page = PAGE_TITLES[page] ? page : (state.loggedIn ? 'dashboard' : 'login');

        state.status = params.status || (page === 'comments' ? 'pending' : '');

        if (page === 'comments' && !params.status) state.commentStatus = 'pending';
        else if (page === 'comments') state.commentStatus = state.status || 'all';
    }

    function statusBadge(status) {
        return status === 'publish'
            ? '<span class="inline-flex rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700">Yayımlanmış</span>'

    function renderDashboard() {
        var views = SEED.posts.reduce(function (s, p) { return s + p.views; }, 0);

        return '<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div>' +

            '<a href="../" class="inline-flex items-center justify-center rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Siteyi aç</a></div>' +
            '<div class="mb-6 bg-white rounded-lg shadow-sm border border-slate-200 p-4 text-sm text-slate-600">' +
            '<p><span class="font-semibold text-slate-900">Ziyaretçi sitesi:</span> <a class="text-[#2271b1] hover:underline" href="../">GitHub Pages önizlemesi</a></p>' +
            '<p class="mt-1"><span class="font-semibold text-slate-900">Yönetim paneli:</span> bu sayfa</p>' +
            '<p class="mt-2 text-slate-500">Yazılar → Yeni Ekle → Yayımla. Canlı sitede PHP hosting gerekir.</p></div>' +
            ((pending || unread) ? '<div class="mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">' +
                (pending ? '<a href="#comments?status=pending" class="block bg-amber-50 border border-amber-200 rounded-lg p-4 hover:bg-amber-100/70"><p class="text-sm font-semibold text-amber-900">' + pending + ' yorum onay bekliyor</p><p class="mt-1 text-xs text-amber-800">Onaylamak için tıklayın.</p></a>' : '') +
                (unread ? '<a href="#messages" class="block bg-sky-50 border border-sky-200 rounded-lg p-4 hover:bg-sky-100/70"><p class="text-sm font-semibold text-sky-900">' + unread + ' yeni iletişim mesajı</p><p class="mt-1 text-xs text-sky-800">Gelen kutusunu açın.</p></a>' : '') +
                '</div>' : '') +
            '<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4 mb-6">' +
            statCard('Toplam Yazı', SEED.posts.length, 'bg-blue-50 text-[#2271b1]') +
            statCard('Görüntülenme', fmt(views), 'bg-emerald-50 text-emerald-600') +
            statCard('Yorumlar', SEED.comments.length, 'bg-amber-50 text-amber-600') +
            statCard('Kullanıcılar', SEED.users.length, 'bg-violet-50 text-violet-600') +
            '</div>' +
            '<div class="grid grid-cols-1 xl:grid-cols-3 gap-6"><div class="xl:col-span-2 bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">' +
            '<div class="flex items-center justify-between px-4 py-3 border-b border-slate-200"><h2 class="text-sm font-semibold text-slate-900">Son Yazılar</h2><a href="#posts" class="text-sm text-[#2271b1] hover:underline">Tümünü gör</a></div>' +
            '<div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500"><tr>' +
            '<th class="px-4 py-3 font-medium">Başlık</th><th class="px-4 py-3 font-medium">Yazar</th><th class="px-4 py-3 font-medium">Durum</th><th class="px-4 py-3 font-medium text-right">Görüntülenme</th><th class="px-4 py-3 font-medium">Tarih</th>' +
            '</tr></thead><tbody class="divide-y divide-slate-100">' + rows + '</tbody></table></div></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4"><h2 class="text-sm font-semibold text-slate-900 mb-1">Haftalık yazı temposu</h2><p class="text-xs text-slate-500 mb-4">Son 7 günde oluşturulan yazılar</p>' +
            '<div class="h-48 flex items-end gap-2">' +
            [18, 18, 18, 18, 40, 18, 70].map(function (h, i) {
                var labels = ['03.09', '04.09', '05.09', '06.09', '07.09', '08.09', '09.09'];
                return '<div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-t bg-blue-200 hover:bg-[#2271b1] transition-colors" style="height:' + h + '%"></div><span class="text-[10px] text-slate-400">' + labels[i] + '</span></div>';
            }).join('') +
            '</div></div></div>';
    }

    function statCard(label, value, iconCls) {
        return '<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 flex items-start gap-4"><span class="inline-flex h-11 w-11 items-center justify-center rounded-lg ' + iconCls + '"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" /></svg></span><div><p class="text-sm text-slate-500">' + label + '</p><p class="text-2xl font-semibold text-slate-900">' + value + '</p></div></div>';
    }

    function filteredPosts() {
        return SEED.posts.filter(function (p) {
            if (state.status && p.status !== state.status) return false;
            if (state.q) {
                var q = state.q.toLocaleLowerCase('tr');
                return (p.title + ' ' + p.excerpt).toLocaleLowerCase('tr').indexOf(q) !== -1;
            }
            return true;
        });
    }

    function renderPosts() {
        var list = filteredPosts();
        var rows = list.map(function (row) {

                '<td class="px-4 py-3 text-slate-600">' + esc(row.author) + '</td>' +

                '<button type="button" data-delete-post="' + row.id + '" class="ml-2 text-red-600 hover:underline">Sil</button></td></tr>';
        }).join('');

            '<a href="#post-new" class="inline-flex items-center justify-center rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Yeni ekle</a></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200"><div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center">' +
            '<div class="flex gap-2 text-sm">' +
            '<a href="#posts' + (state.q ? '?q=' + encodeURIComponent(state.q) : '') + '" class="' + (state.status === '' ? 'font-semibold text-slate-900' : 'text-slate-500 hover:text-slate-800') + '">Tümü</a><span class="text-slate-300">|</span>' +
            '<a href="#posts?status=publish' + q + '" class="' + (state.status === 'publish' ? 'font-semibold text-slate-900' : 'text-slate-500 hover:text-slate-800') + '">Yayımlanmış</a><span class="text-slate-300">|</span>' +
            '<a href="#posts?status=draft' + q + '" class="' + (state.status === 'draft' ? 'font-semibold text-slate-900' : 'text-slate-500 hover:text-slate-800') + '">Taslak</a></div>' +
            '<form id="posts-search" class="sm:ml-auto flex gap-2"><input type="search" name="q" value="' + esc(state.q) + '" placeholder="Yazı ara…" class="rounded-md border border-slate-200 px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">' +

            '<th class="px-4 py-3 font-medium">Başlık</th><th class="px-4 py-3 font-medium">Yazar</th><th class="px-4 py-3 font-medium">Kategoriler</th><th class="px-4 py-3 font-medium">Durum</th><th class="px-4 py-3 font-medium text-right">Görüntülenme</th><th class="px-4 py-3 font-medium">Tarih</th><th class="px-4 py-3 font-medium text-right">İşlem</th>' +

            (rows || '<tr><td colspan="7" class="px-4 py-10 text-center text-slate-500">Kayıt bulunamadı.</td></tr>') +
            '</tbody></table></div></div>';

    function renderPostNew() {
        var post = SEED.posts.filter(function (p) { return p.id === state.editPostId; })[0] || {
            id: 0, title: '', content: '', excerpt: '', status: 'draft', categories: ''

        var cats = SEED.categories.map(function (c) {

        }).join('');

            '<form id="post-form" class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">' +

            '<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4"><label class="mb-2 block text-sm font-medium text-slate-700">Özet</label>' +

            '<div class="space-y-4 lg:sticky lg:top-20">' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200"><div class="border-b border-slate-200 px-4 py-3"><h2 class="text-sm font-semibold text-slate-900">Yayımla</h2></div>' +

            '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="sr-only"></label></div></div></div></form>';
    }

    function renderCategories() {
        var rows = SEED.categories.map(function (c) {
            return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium text-slate-900">' + esc(c.name) + '</td>' +

            '</tr></thead><tbody class="divide-y divide-slate-100">' + rows + '</tbody></table></div></div>';

    function renderPages() {
        var edit = SEED.pages.filter(function (p) { return p.id === state.editPageId; })[0];
        var rows = SEED.pages.map(function (row) {
            return '<tr class="hover:bg-slate-50' + (row.id === state.editPageId ? ' bg-blue-50/40' : '') + '"><td class="px-4 py-3 font-medium text-slate-900">' + esc(row.title) + '</td>' +

                '<td class="px-4 py-3 text-slate-500 whitespace-nowrap">' + esc(row.updated_at) + '</td>' +
                '<td class="px-4 py-3 text-right"><a href="#pages?id=' + row.id + '" class="text-[#2271b1] hover:underline mr-2">Düzenle</a>' +
                '<button type="button" data-delete-page="' + row.id + '" class="text-red-600 hover:underline">Sil</button></td></tr>';
        }).join('');
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">Sayfalar</h1><p class="mt-1 text-sm text-slate-500">Sabit sayfalar (Hakkında, İletişim vb.). Yayımlananlar üst menüde görünür.</p></div>' +
            '<div class="grid grid-cols-1 xl:grid-cols-3 gap-6"><div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 h-fit">' +
            '<div class="flex items-center justify-between mb-4"><h2 class="text-sm font-semibold text-slate-900">' + (edit ? 'Sayfayı düzenle' : 'Yeni sayfa') + '</h2>' +
            (edit ? '<a href="#pages" class="text-xs text-[#2271b1] hover:underline">Yeni oluştur</a>' : '') + '</div>' +
            '<form id="page-form" class="space-y-3"><input type="hidden" name="page_id" value="' + (edit ? edit.id : 0) + '">' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Başlık</label><input name="title" required value="' + esc(edit ? edit.title : '') + '" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">İçerik</label><textarea name="content" rows="8" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">' + esc(edit ? edit.content : '') + '</textarea></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Durum</label><select name="status" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"><option value="draft"' + (edit && edit.status === 'draft' ? ' selected' : '') + '>Taslak</option><option value="publish"' + (edit && edit.status === 'publish' ? ' selected' : '') + '>Yayımlanmış</option></select></div>' +
            '<button class="rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">' + (edit ? 'Güncelle' : 'Kaydet') + '</button></form></div>' +
            '<div class="xl:col-span-2 bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500"><tr>' +
            '<th class="px-4 py-3 font-medium">Başlık</th><th class="px-4 py-3 font-medium">Kalıcı bağlantı</th><th class="px-4 py-3 font-medium">Durum</th><th class="px-4 py-3 font-medium">Güncelleme</th><th class="px-4 py-3 font-medium text-right">İşlem</th>' +
            '</tr></thead><tbody class="divide-y divide-slate-100">' + rows + '</tbody></table></div></div>';
    }

    function renderMedia() {
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">Medya Kütüphanesi</h1><p class="mt-1 text-sm text-slate-500">0 dosya</p></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 mb-6"><form id="media-form" class="flex flex-col gap-3 sm:flex-row sm:items-end">' +
            '<div class="flex-1"><label class="mb-1 block text-sm font-medium text-slate-700">Dosya yükle</label>' +
            '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="block w-full text-sm text-slate-600 file:mr-3 file:rounded-md file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:text-sm file:font-medium"></div>' +
            '<button class="rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Yükle</button></form></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200 px-4 py-12 text-center text-slate-500">Kütüphanede henüz görsel yok.</div>';
    }

    function renderComments() {
        var filter = state.commentStatus || 'pending';
        var counts = { pending: 0, approved: 0, spam: 0 };
        SEED.comments.forEach(function (c) { counts[c.status] = (counts[c.status] || 0) + 1; });
        var list = SEED.comments.filter(function (c) { return filter === 'all' || c.status === filter; });
        var items = list.map(function (row) {
            var badge = row.status === 'approved' ? 'bg-emerald-50 text-emerald-700' : (row.status === 'spam' ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-700');
            var label = row.status === 'approved' ? 'Onaylı' : (row.status === 'spam' ? 'Spam' : 'Onay bekliyor');
            return '<div class="px-4 py-4"><div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between"><div class="min-w-0">' +
                '<p class="text-sm font-medium text-slate-900">' + esc(row.author_name) + '</p>' +
                '<p class="text-xs text-slate-400 mt-0.5">' + esc(row.created_at) + ' · ' + esc(row.title) + '</p>' +
                '<p class="mt-2 text-sm text-slate-700 whitespace-pre-wrap">' + esc(row.content) + '</p></div>' +
                '<div class="flex flex-wrap gap-2 text-xs shrink-0"><span class="inline-flex rounded-full px-2 py-0.5 font-medium ' + badge + '">' + label + '</span>' +
                (row.status !== 'approved' ? '<button type="button" data-comment-action="approve" data-id="' + row.id + '" class="text-[#2271b1] hover:underline">Onayla</button>' : '<button type="button" data-comment-action="pending" data-id="' + row.id + '" class="text-slate-600 hover:underline">Beklet</button>') +
                (row.status !== 'spam' ? '<button type="button" data-comment-action="spam" data-id="' + row.id + '" class="text-amber-700 hover:underline">Spam</button>' : '') +
                '<button type="button" data-comment-action="delete" data-id="' + row.id + '" class="text-red-600 hover:underline">Sil</button></div></div></div>';
        }).join('');
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">Yorumlar</h1><p class="mt-1 text-sm text-slate-500">Ziyaretçi yorumlarını onaylayın veya kaldırın.</p></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200"><div class="flex flex-wrap gap-2 border-b border-slate-200 p-4 text-sm">' +
            '<a href="#comments?status=all" class="' + (filter === 'all' ? 'font-semibold text-slate-900' : 'text-slate-500') + '">Tümü (' + SEED.comments.length + ')</a><span class="text-slate-300">|</span>' +
            '<a href="#comments?status=pending" class="' + (filter === 'pending' ? 'font-semibold text-slate-900' : 'text-slate-500') + '">Onay bekleyen (' + counts.pending + ')</a><span class="text-slate-300">|</span>' +
            '<a href="#comments?status=approved" class="' + (filter === 'approved' ? 'font-semibold text-slate-900' : 'text-slate-500') + '">Onaylı (' + counts.approved + ')</a><span class="text-slate-300">|</span>' +
            '<a href="#comments?status=spam" class="' + (filter === 'spam' ? 'font-semibold text-slate-900' : 'text-slate-500') + '">Spam (' + (counts.spam || 0) + ')</a></div>' +
            '<div class="divide-y divide-slate-100">' + (items || '<p class="px-4 py-10 text-center text-sm text-slate-500">Kayıt yok.</p>') + '</div></div>';
    }

    function renderMessages() {
        var items = SEED.messages.map(function (row) {
            return '<div class="px-4 py-4 ' + (!row.is_read ? 'bg-blue-50/40' : '') + '"><div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between"><div class="min-w-0">' +
                '<p class="text-sm font-medium text-slate-900">' + esc(row.name) + (!row.is_read ? ' <span class="ml-2 inline-flex rounded-full bg-blue-100 px-2 py-0.5 text-[11px] font-medium text-blue-700">Yeni</span>' : '') + '</p>' +
                '<p class="text-xs text-slate-400 mt-0.5">' + esc(row.email) + ' · ' + esc(row.created_at) + '</p>' +
                '<p class="mt-2 text-sm text-slate-700">' + esc(row.message) + '</p></div>' +
                '<div class="flex gap-2 text-xs shrink-0">' +
                '<button type="button" data-message-action="' + (row.is_read ? 'unread' : 'read') + '" data-id="' + row.id + '" class="text-[#2271b1] hover:underline">' + (row.is_read ? 'Okunmadı' : 'Okundu') + '</button>' +
                '<button type="button" data-message-action="delete" data-id="' + row.id + '" class="text-red-600 hover:underline">Sil</button></div></div></div>';
        }).join('');
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">İletişim mesajları</h1><p class="mt-1 text-sm text-slate-500">Sitedeki iletişim formundan gelen kayıtlar.</p></div>' +
            '<div class="bg-white rounded-lg shadow-sm border border-slate-200 divide-y divide-slate-100">' +
            (items || '<p class="px-4 py-10 text-center text-sm text-slate-500">Henüz mesaj yok.</p>') + '</div>';
    }

    function renderUsers() {
        var rows = SEED.users.map(function (row) {
            return '<tr class="hover:bg-slate-50' + (row.id === 1 ? ' bg-blue-50/40' : '') + '"><td class="px-4 py-3 font-medium text-slate-900">' + esc(row.display_name) + '</td>' +
                '<td class="px-4 py-3 text-slate-600">' + esc(row.username) + '</td><td class="px-4 py-3 text-slate-600">' + esc(row.email) + '</td>' +
                '<td class="px-4 py-3">' + esc(row.role) + '</td><td class="px-4 py-3 text-slate-500 whitespace-nowrap">' + esc(row.created_at) + '</td></tr>';
        }).join('');
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">Kullanıcılar</h1><p class="mt-1 text-sm text-slate-500">Panel erişimi olan hesaplar.</p></div>' +
            '<div class="grid grid-cols-1 xl:grid-cols-3 gap-6"><div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 h-fit"><h2 class="text-sm font-semibold text-slate-900 mb-4">Yeni kullanıcı</h2>' +
            '<form id="user-form" class="space-y-3"><div><label class="mb-1 block text-sm font-medium text-slate-700">Kullanıcı adı</label><input name="username" required class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">E-posta</label><input name="email" type="email" required class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Görünen ad</label><input name="display_name" required class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Şifre</label><input name="password" type="password" minlength="8" required class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Rol</label><select name="role" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"><option value="author">Yazar</option><option value="editor">Editör</option><option value="admin">Yönetici</option></select></div>' +
            '<button class="rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Ekle</button></form></div>' +
            '<div class="xl:col-span-2 bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500"><tr>' +
            '<th class="px-4 py-3 font-medium">Ad</th><th class="px-4 py-3 font-medium">Kullanıcı adı</th><th class="px-4 py-3 font-medium">E-posta</th><th class="px-4 py-3 font-medium">Rol</th><th class="px-4 py-3 font-medium">Kayıt</th>' +
            '</tr></thead><tbody class="divide-y divide-slate-100">' + rows + '</tbody></table></div></div>';
    }

    function renderSettings() {
        var s = SEED.settings;
        return '<div class="mb-6"><h1 class="text-2xl font-semibold text-slate-900">Ayarlar</h1><p class="mt-1 text-sm text-slate-500">Genel site bilgileri.</p></div>' +
            '<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-slate-200 p-6"><form id="settings-form" class="space-y-4">' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Site başlığı</label><input name="site_title" value="' + esc(s.site_title) + '" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Slogan</label><input name="site_tagline" value="' + esc(s.site_tagline) + '" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Site URL</label><input name="site_url" value="' + esc(s.site_url) + '" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm"><p class="mt-1 text-xs text-slate-400">“Siteyi görüntüle” bağlantısı bu adresi açar.</p></div>' +
            '<div><label class="mb-1 block text-sm font-medium text-slate-700">Sayfa başına yazı</label><input name="posts_per_page" type="number" min="5" max="50" value="' + esc(s.posts_per_page) + '" class="w-32 rounded-md border border-slate-200 px-3 py-2 text-sm"></div>' +
            '<button class="rounded-md bg-[#2271b1] px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Değişiklikleri kaydet</button></form></div>';
    }

    function pageInner() {
        switch (state.page) {
            case 'posts': return renderPosts();
            case 'post-new': return renderPostNew();
            case 'categories': return renderCategories();
            case 'pages': return renderPages();
            case 'media': return renderMedia();
            case 'comments': return renderComments();
            case 'messages': return renderMessages();
            case 'users': return renderUsers();
            case 'settings': return renderSettings();
            default: return renderDashboard();
        }
    }

    function bindShell() {
        var sidebar = document.getElementById('admin-sidebar');
        var toggle = document.getElementById('sidebar-toggle');
        var backdrop = document.getElementById('sidebar-backdrop');
        function closeSidebar() {
            if (!sidebar) return;
            sidebar.classList.add('-translate-x-full');
            if (backdrop) backdrop.classList.add('hidden');
        }
        function openSidebar() {
            if (!sidebar) return;
            sidebar.classList.remove('-translate-x-full');
            if (backdrop) backdrop.classList.remove('hidden');
        }
        if (toggle) {
            toggle.addEventListener('click', function () {
                if (sidebar && sidebar.classList.contains('-translate-x-full')) openSidebar();
                else closeSidebar();
            });
        }
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
        document.querySelectorAll('[data-submenu-toggle]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = btn.getAttribute('data-submenu-toggle');
                var panel = id ? document.getElementById(id) : null;
                if (!panel) return;
                panel.classList.toggle('hidden');
                btn.setAttribute('aria-expanded', panel.classList.contains('hidden') ? 'false' : 'true');
                var chevron = btn.querySelector('[data-submenu-chevron]');
                if (chevron) chevron.classList.toggle('rotate-180');
            });
        });
        document.querySelectorAll('[data-dropdown]').forEach(function (wrap) {
            var button = wrap.querySelector('[data-dropdown-button]');
            var panel = wrap.querySelector('[data-dropdown-panel]');
            if (!button || !panel) return;
            button.addEventListener('click', function (ev) {
                ev.stopPropagation();
                document.querySelectorAll('[data-dropdown-panel]').forEach(function (other) {
                    if (other !== panel) other.classList.add('hidden');
                });
                panel.classList.toggle('hidden');
            });
        });

        var headerSearch = document.getElementById('header-search');
        if (headerSearch) {
            headerSearch.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var q = headerSearch.querySelector('[name=q]').value;
                go('#posts' + (q ? '?q=' + encodeURIComponent(q) : ''));
            });
        }
        var postsSearch = document.getElementById('posts-search');
        if (postsSearch) {
            postsSearch.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var q = postsSearch.querySelector('[name=q]').value;
                var hash = '#posts';
                var parts = [];
                if (state.status) parts.push('status=' + encodeURIComponent(state.status));
                if (q) parts.push('q=' + encodeURIComponent(q));
                if (parts.length) hash += '?' + parts.join('&');
                go(hash);
            });
        }
        document.querySelectorAll('[data-delete-post]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (!confirm('Bu yazı silinsin mi?')) return;
                var id = parseInt(btn.getAttribute('data-delete-post'), 10);
                SEED.posts = SEED.posts.filter(function (p) { return p.id !== id; });
                setFlash('success', 'Yazı silindi.');
                render();
            });
        });
        document.querySelectorAll('[data-delete-cat]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (!confirm('Kategori silinsin mi?')) return;
                var id = parseInt(btn.getAttribute('data-delete-cat'), 10);
                SEED.categories = SEED.categories.filter(function (c) { return c.id !== id; });
                setFlash('success', 'Kategori silindi.');
                render();
            });
        });
        document.querySelectorAll('[data-delete-page]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (!confirm('Sayfa silinsin mi?')) return;
                var id = parseInt(btn.getAttribute('data-delete-page'), 10);
                SEED.pages = SEED.pages.filter(function (p) { return p.id !== id; });
                setFlash('success', 'Sayfa silindi.');
                go('#pages');
            });
        });
        document.querySelectorAll('[data-comment-action]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = parseInt(btn.getAttribute('data-id'), 10);
                var action = btn.getAttribute('data-comment-action');
                if (action === 'delete') {
                    if (!confirm('Yorum silinsin mi?')) return;
                    SEED.comments = SEED.comments.filter(function (c) { return c.id !== id; });
                    setFlash('success', 'Yorum silindi.');
                } else {
                    SEED.comments.forEach(function (c) {
                        if (c.id === id) c.status = action === 'approve' ? 'approved' : action;
                    });
                    setFlash('success', action === 'approve' ? 'Yorum onaylandı.' : (action === 'spam' ? 'Yorum spam olarak işaretlendi.' : 'Yorum onaya alındı.'));
                }
                render();
            });
        });
        document.querySelectorAll('[data-message-action]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = parseInt(btn.getAttribute('data-id'), 10);
                var action = btn.getAttribute('data-message-action');
                if (action === 'delete') {
                    if (!confirm('Mesaj silinsin mi?')) return;
                    SEED.messages = SEED.messages.filter(function (m) { return m.id !== id; });
                    setFlash('success', 'Mesaj silindi.');
                } else {
                    SEED.messages.forEach(function (m) {
                        if (m.id === id) m.is_read = action === 'read' ? 1 : 0;
                    });
                    setFlash('success', action === 'read' ? 'Mesaj okundu olarak işaretlendi.' : 'Mesaj okunmadı olarak işaretlendi.');
                }
                render();
            });
        });
        var postForm = document.getElementById('post-form');
        if (postForm) {
            postForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                setFlash('success', 'Önizlemede yazı kaydı simüle edildi. Canlı sitede PHP/MySQL gerekir.');
                go('#posts');
            });
        }
        var catForm = document.getElementById('cat-form');
        if (catForm) {
            catForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var name = catForm.querySelector('[name=name]').value.trim();
                if (!name) return;
                var id = SEED.categories.reduce(function (m, c) { return Math.max(m, c.id); }, 0) + 1;
                SEED.categories.push({ id: id, name: name, slug: name.toLowerCase().replace(/\s+/g, '-'), post_count: 0 });
                setFlash('success', 'Kategori eklendi.');
                render();
            });
        }
        var pageForm = document.getElementById('page-form');
        if (pageForm) {
            pageForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                setFlash('success', 'Sayfa kaydedildi (önizleme).');
                go('#pages');
            });
        }
        var mediaForm = document.getElementById('media-form');
        if (mediaForm) {
            mediaForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                setFlash('error', 'GitHub Pages önizlemesinde dosya yüklenmez.');
                render();
            });
        }
        var userForm = document.getElementById('user-form');
        if (userForm) {
            userForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var roleMap = { author: 'Yazar', editor: 'Editör', admin: 'Yönetici' };
                SEED.users.push({
                    id: SEED.users.length + 1,
                    display_name: userForm.querySelector('[name=display_name]').value,
                    username: userForm.querySelector('[name=username]').value,
                    email: userForm.querySelector('[name=email]').value,
                    role: roleMap[userForm.querySelector('[name=role]').value] || 'Yazar',
                    created_at: '09.09.2026 20:00'
                });
                setFlash('success', 'Kullanıcı eklendi.');
                render();
            });
        }
        var settingsForm = document.getElementById('settings-form');
        if (settingsForm) {
            settingsForm.addEventListener('submit', function (ev) {
                ev.preventDefault();
                SEED.settings.site_title = settingsForm.querySelector('[name=site_title]').value;
                SEED.settings.site_tagline = settingsForm.querySelector('[name=site_tagline]').value;
                SEED.settings.site_url = settingsForm.querySelector('[name=site_url]').value;
                SEED.settings.posts_per_page = settingsForm.querySelector('[name=posts_per_page]').value;
                setFlash('success', 'Ayarlar kaydedildi.');
                render();
            });
        }
    }

    function render() {
        parseHash();
        var app = document.getElementById('app');
        if (!state.loggedIn || state.page === 'login') {
            app.innerHTML = renderLogin();
            var form = document.getElementById('login-form');
            if (form) {
                form.addEventListener('submit', function (ev) {
                    ev.preventDefault();
                    var user = form.username.value.trim();
                    var pass = form.password.value;
                    if (user === 'admin' && pass === 'Admin123!') {
                        sessionStorage.setItem('cms_preview_auth', '1');
                        state.loggedIn = true;
                        state.loginError = '';
                        go('#dashboard');
                    } else {
                        state.loginError = 'Kullanıcı adı veya şifre hatalı.';
                        render();
                    }
                });
            }
            return;
        }
        app.innerHTML = renderShell(pageInner());
        bindShell();
        state.flash = null;
    }

    document.addEventListener('click', function () {
        document.querySelectorAll('[data-dropdown-panel]').forEach(function (panel) {
            panel.classList.add('hidden');
        });
    });

    window.addEventListener('hashchange', render);
    if (!location.hash) location.hash = state.loggedIn ? '#dashboard' : '#login';
    render();
})();
</script>
</body>
</html>
